<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Viewer</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --dim: #8b949e;
    --editor: #d29922; --writer: #4493f8; --checker: #3fb950; --harness: #8b949e; --fail: #f85149;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header { display: flex; gap: 16px; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  .live { margin-left: auto; color: var(--dim); font-size: 12px; }
  .live.on::before { content: "● "; color: var(--checker); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }
  .summary { display: flex; flex-wrap: wrap; gap: 24px; align-items: baseline; margin-bottom: 20px; }
  .summary .req { font-size: 18px; flex: 1 1 320px; }
  .stat { color: var(--dim); font-size: 12px; } .stat b { display: block; color: var(--text); font-size: 18px; font-variant-numeric: tabular-nums; }
  .badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .pass { color: var(--checker); } .stat a { color: inherit; } .fail { color: var(--fail); }

  /* 구조도 */
  .diagram { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 8px;
             background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 20px; position: relative; }
  .agent { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; transition: box-shadow .3s, border-color .3s; }
  .agent h3 { margin: 0 0 2px; font-size: 14px; } .agent p { margin: 0; color: var(--dim); font-size: 12px; }
  .agent .perm { margin-top: 8px; font-family: ui-monospace, monospace; font-size: 11px; color: var(--dim); }
  .agent .meta { margin-top: 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .agent[data-role=editor] h3 { color: var(--editor); } .agent[data-role=writer] h3 { color: var(--writer); } .agent[data-role=checker] h3 { color: var(--checker); }
  .agent.active { border-color: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 25%, transparent); }
  .agent[data-role=editor].active { color: var(--editor); } .agent[data-role=writer].active { color: var(--writer); } .agent[data-role=checker].active { color: var(--checker); }
  .agent.active p, .agent.active .meta { color: var(--text); }
  .agent.off { opacity: .35; }
  .arrow { color: var(--dim); font-size: 11px; text-align: center; white-space: nowrap; }
  .arrow span { display: block; font-size: 20px; line-height: 1; }
  .harness-label { grid-column: 1 / -1; color: var(--dim); font-size: 12px; border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 6px; }

  .cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .cols, .diagram { grid-template-columns: 1fr; } .arrow span { transform: rotate(90deg); } }

  /* 타임라인 */
  ol.timeline { list-style: none; margin: 0; padding: 0; }
  .ev { position: relative; padding: 10px 12px 10px 18px; border-left: 2px solid var(--line); }
  .ev::before { content: ""; position: absolute; left: -6px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--harness)); }
  .ev .top { display: flex; gap: 8px; align-items: baseline; }
  .ev .role { color: var(--c); font-weight: 600; font-size: 12px; min-width: 72px; }
  .ev .num { margin-left: auto; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ev.running .step::after { content: " …"; animation: blink 1.2s infinite; }
  .files { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; }
  .files button { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 4px; padding: 1px 7px; font: 12px ui-monospace, monospace; cursor: pointer; }
  .files button:hover, .files button.sel { color: var(--text); border-color: var(--dim); }
  .verdict { padding: 8px 12px 8px 18px; border-left: 2px solid var(--line); font-size: 13px; }
  .verdict .ids { color: var(--dim); font-family: ui-monospace, monospace; font-size: 12px; }

  /* 산출물 */
  .doc { position: sticky; top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 240px; max-height: calc(100vh - 32px); overflow: auto; }
  .doc .path { padding: 10px 16px; border-bottom: 1px solid var(--line); color: var(--dim); font: 12px ui-monospace, monospace; }
  .doc pre { margin: 0; padding: 16px; white-space: pre-wrap; word-break: break-word; font: 13px/1.6 ui-monospace, "Cascadia Mono", monospace; }
  .empty { color: var(--dim); padding: 40px 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1><a href="/" style="color:inherit;text-decoration:none">← 브리핑</a> · 하네스 과정</h1>
  <select id="runs" aria-label="실행 기록 선택"></select>
  <span id="live" class="live"></span>
</header>
<main>
  <section class="summary" id="summary"></section>

  <section class="diagram" aria-label="하네스 구조도">
    <div class="agent" data-role="editor"><h3>Editor</h3><p>후보 기사 선정 · 기사별 계약(브리프)</p><div class="perm">tools: 없음</div><div class="meta"></div></div>
    <div class="arrow"><span>→</span>brief</div>
    <div class="agent" data-role="writer"><h3>Writer</h3><p>계약대로 요약 · 판정 받으면 고쳐 씀</p><div class="perm">tools: 없음</div><div class="meta"></div></div>
    <div class="arrow"><span>⇄</span>draft · verdict</div>
    <div class="agent" data-role="checker"><h3>Checker</h3><p>문장마다 원문 근거 대조</p><div class="perm">tools: 없음 · 인용은 코드가 재대조</div><div class="meta"></div></div>
    <div class="harness-label">Harness (harness/run.js) — 수집·순서·재시도 상한·합격 판정을 코드로 쥐고 있음. 에이전트끼리는 runs/&lt;id&gt;/ 의 파일로만 대화한다.</div>
  </section>

  <div class="cols">
    <ol class="timeline" id="timeline"></ol>
    <section class="doc" id="doc"><div class="empty">타임라인의 파일을 누르면 여기에 내용이 보입니다</div></section>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmtMs = (ms) => (ms < 60000 ? `${(ms / 1000).toFixed(0)}s` : `${Math.floor(ms / 60000)}m ${Math.round((ms % 60000) / 1000)}s`);
const fmtUsd = (n) => `$${n.toFixed(2)}`;
const ROLE = { editor: 'Editor', writer: 'Writer', checker: 'Checker', harness: 'Harness' };

let current = null, timer = null, openFile = null;

async function loadRuns() {
  const res = await fetch('/api/runs');
  const runs = res.ok ? await res.json() : [];
  $('#runs').innerHTML = runs.map((r) => `<option>${esc(r)}</option>`).join('') || '<option value="">runs/ 비어 있음</option>';
  const pick = new URLSearchParams(location.search).get('run');
  if (pick && runs.includes(pick)) $('#runs').value = pick;
  select($('#runs').value);
}

function select(id) {
  current = id; openFile = null;
  history.replaceState(null, '', id ? `?run=${encodeURIComponent(id)}` : location.pathname);
  $('#doc').innerHTML = '<div class="empty">타임라인의 파일을 누르면 여기에 내용이 보입니다</div>';
  clearTimeout(timer);
  if (id) refresh(); else render([]);
}

async function refresh() {
  const id = current;
  const text = await fetch(`/runs/${encodeURIComponent(id)}/events.jsonl`).then((r) => (r.ok ? r.text() : ''));
  if (id !== current) return;
  const events = text.trim().split('\n').filter(Boolean).map((l) => JSON.parse(l));
  render(events);
  const done = events.some((e) => e.type === 'done');
  $('#live').className = done ? 'live' : 'live on';
  $('#live').textContent = done ? '완료된 실행' : '실행 중';
  if (!done) timer = setTimeout(refresh, 1500);
}

function render(events) {
  const start = events[0], done = events.find((e) => e.type === 'done');
  const ends = events.filter((e) => e.type === 'agent_end');
  const last = events.at(-1);
  const elapsed = start ? (done || last).t - start.t : 0;
  const cost = ends.reduce((s, e) => s + (e.cost || 0), 0);

  $('#summary').innerHTML = start ? `
    <div class="req"><span class="badge">${esc(start.mode.toUpperCase())}</span> ${esc(start.request)}</div>
    <div class="stat">경과<b>${fmtMs(elapsed)}</b></div>
    <div class="stat">에이전트 호출<b>${ends.length}</b></div>
    <div class="stat">비용 환산<b>${fmtUsd(cost)}</b></div>
    <div class="stat">발행<b>${done ? `${done.published}건` : '—'}</b></div>
    ${done?.sentences !== undefined ? `<div class="stat">감사: 근거 없는 문장<b class="${done.unsupported ? 'fail' : 'pass'}">${done.unsupported} / ${done.sentences}</b></div>` : ''}
    ${done ? `<div class="stat">결과물<b><a href="/?run=${encodeURIComponent(current)}">브리핑 보기 →</a></b></div>` : ''}` : '';

  // 구조도: 역할별 누적 + 지금 일하는 에이전트 강조
  const running = new Map();
  for (const e of events) {
    if (e.type === 'agent_start') running.set(e.role, e);
    if (e.type === 'agent_end') running.delete(e.role);
  }
  for (const el of document.querySelectorAll('.agent')) {
    const role = el.dataset.role;
    const mine = ends.filter((e) => e.role === role);
    el.classList.toggle('active', running.has(role));
    el.classList.toggle('off', start?.mode === 'solo' && role !== 'writer');
    el.querySelector('.meta').textContent = running.has(role)
      ? `▶ ${running.get(role).step}`
      : mine.length ? `${mine.length}회 · ${fmtMs(mine.reduce((s, e) => s + e.ms, 0))} · ${fmtUsd(mine.reduce((s, e) => s + (e.cost || 0), 0))}` : '';
  }

  // 타임라인: agent_start 하나를 카드 하나로, 뒤따르는 artifact를 그 카드에 붙인다
  const items = [];
  let card = null;
  for (const e of events) {
    if (e.type === 'agent_start') items.push((card = { ...e, files: [] }));
    else if (e.type === 'agent_end' && card) Object.assign(card, { end: e });
    else if (e.type === 'artifact' && e.role === 'harness') items.push({ role: 'harness', step: '발행', end: {}, files: [e.file] });
    else if (e.type === 'artifact') card?.files.push(e.file);
    else if (e.type === 'verdict') items.push(e);
  }
  $('#timeline').innerHTML = items.map((it) => {
    if (it.type === 'verdict') {
      const n = it.total - it.failed.length;
      return `<li class="verdict"><b class="${it.pass ? 'pass' : 'fail'}">${it.pass ? 'PASS' : 'FAIL'}</b> ${esc(it.tag)} — ${n}/${it.total} 통과
        ${it.failed.length ? `<div class="ids">실패: ${it.failed.map(esc).join(', ')}</div>` : ''}</li>`;
    }
    return `<li class="ev ${it.end ? '' : 'running'}" style="--c: var(--${it.role})">
      <div class="top"><span class="role">${ROLE[it.role]}</span><span class="step">${esc(it.step)}</span>
        <span class="num">${it.end?.ms ? fmtMs(it.end.ms) : ''}</span></div>
      <div class="files">${it.files.map((f) => `<button data-file="${esc(f)}" class="${f === openFile ? 'sel' : ''}">${esc(f)}</button>`).join('')}</div>
    </li>`;
  }).join('') || '<li class="empty">이벤트가 아직 없습니다</li>';
}

async function show(file) {
  openFile = file;
  for (const b of document.querySelectorAll('.files button')) b.classList.toggle('sel', b.dataset.file === file);
  const text = await fetch(`/runs/${encodeURIComponent(current)}/${file.split('/').map(encodeURIComponent).join('/')}`).then((r) => r.text());
  $('#doc').innerHTML = `<div class="path">runs/${esc(current)}/${esc(file)}</div><pre>${esc(text)}</pre>`;
}

$('#timeline').addEventListener('click', (e) => { const f = e.target.closest('button')?.dataset.file; if (f) show(f); });
$('#runs').addEventListener('change', (e) => select(e.target.value));
loadRuns();
</script>
</body>
</html>
