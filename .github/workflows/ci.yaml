# 하네스 배관 테스트만 돈다. Claude 호출(실제 하네스 실행)은 각자의 로그인이 필요해서 CI에서 하지 않는다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
